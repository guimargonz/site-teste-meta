    <link rel="stylesheet" href="./src/styles/styles.css">

</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="server.html">Server</a></li>
                <li><a href="ramais.html">Ramais</a></li>

            </ul>
        </nav>
        <input type="text" id="search" placeholder="Buscar script..." onkeyup="searchScripts()">
    </header>

    <main>
        <h1>Scripts de Chamados</h1>

        <section class="about-site">
            <div class="add-server-section">
                <button id="showAddFormBtn" class="btn btn-primary">Adicionar Novo Script</button>
                <div id="addFormContainer" style="display: none;">
                    <h2>Adicionar Novo Script</h2>
                    <form id="addScriptForm">
                        <div class="form-group">
                            <label for="title">Título:</label>
                            <input type="text" id="title" placeholder="Nome do Script" required>
                        </div>
                        <div class="form-group">
                            <label for="scriptContent">Conteúdo do Script:</label>
                            <textarea id="scriptContent" placeholder="Insira o conteúdo do script aqui..." required
                                rows="5"></textarea>
                        </div>

                        <div class="form-buttons">
                            <button class="btn btn-primary" type="submit">Adicionar</button>
                            <button type="button" id="cancelAddBtn" class="btn">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <section id="scripts-container">
            <!-- Os scripts serão carregados dinamicamente aqui -->
        </section>
    </main>

    <footer>

    </footer>
