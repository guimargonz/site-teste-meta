<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Senhas</title>
    <link rel="stylesheet" href="./src/styles/styles.css">
    <link rel="stylesheet" href="./src/styles/senhas.css"> <!-- CSS específico (opcional) -->
</head>
<body>
    <header>
        <nav>
             <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="server.html">Server</a></li>
                <li><a href="ramais.html">Ramais</a></li>
                <li><a href="scripts-chamados.html">Chamados</a></li>
                <li><a href="sda.html">Ligações</a></li>
                <li><a href="instrucoes.html">Instruções</a></li>
                <li><a href="site_bookmarks.html">Bookmarks</a></li>
                <li><a href="senhas.html">Senhas</a></li> <!-- Link para a página de senhas -->
            </ul>
        </nav>
        <input type="text" id="search" placeholder="Buscar senha por título..." onkeyup="searchSenhas()">
    </header>

    <main class="container">
        <h1>Gerenciador de Senhas</h1>

         <section class="about-site">
            <div class="add-server-section">
                <button id="showAddFormBtn" class="btn btn-primary">Adicionar Nova Senha</button>
                <div id="addFormContainer" style="display: none;">
                    <h2>Adicionar Nova Senha</h2>
                    <form id="addSenhaForm">
                        <div class="form-group">
                            <label for="title">Título/Serviço:</label>
                            <input type="text" id="title" placeholder="Ex: Wifi Admin, Servidor X" required>
                        </div>
                         <div class="form-group">
                            <label for="username">Usuário (opcional):</label>
                            <input type="text" id="username" placeholder="Ex: admin">
                        </div>
                        <div class="form-group">
                            <label for="password">Senha:</label>
                            <input type="password" id="password" placeholder="Digite a senha" required>
                             <button type="button" id="togglePasswordVisibility" class="btn btn-secondary" style="margin-left: 5px;">Mostrar</button>
                        </div>

                        <div class="form-buttons">
                            <button class="btn btn-primary" type="submit">Adicionar</button>
                            <button type="button" id="cancelAddBtn" class="btn">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <section id="senhas-container">
            <!-- As senhas serão carregadas dinamicamente aqui -->
            <p>Carregando senhas...</p>
        </section>
    </main>

    <footer>
        <p>© 2024 Guilherme Gonzaga - Todos os direitos reservados.</p>
    </footer>

    <script src="./src/js/senhas.js"></script>
    <script src="./src/js/autenticacao.js"></script> <!-- Autenticação é essencial -->
</body>
</html>
